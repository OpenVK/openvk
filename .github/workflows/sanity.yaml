name: PR sanity checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Conventional commit in PR title
    runs-on: ubuntu-latest

    steps:
      # Commits are squash-merged and the PR title is used as the commit message
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          RE='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?:[[:space:]].+'
          if [[ "$TITLE" =~ $RE ]]; then
            echo "PR title is fine: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits (allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test), got: '$TITLE'"
            exit 1
          fi

  entity-setters:
    name: DB entity setters
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:10.9
        env:
          MARIADB_DATABASE: openvk
          MARIADB_USER: openvk
          MARIADB_PASSWORD: openvk
          MARIADB_RANDOM_ROOT_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, yaml, intl, gd, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Prepare config
        run: |
          php -r '
          require "vendor/autoload.php";
          $config = Symfony\Component\Yaml\Yaml::parseFile("openvk-example.yml");
          $config["chandler"]["database"]["dsn"] = "mysql:host=127.0.0.1;dbname=openvk;charset=utf8mb4";
          $config["chandler"]["database"]["user"] = "openvk";
          $config["chandler"]["database"]["password"] = "openvk";
          $config["chandler"]["security"]["secret"] = str_repeat("a", 64);
          $config["chandler"]["security"]["csrfProtection"] = "permissive";
          $config["openvk"]["credentials"]["eventDB"]["enable"] = false;
          $config["openvk"]["credentials"]["redis"]["enable"] = false;
          file_put_contents("openvk.yml", Symfony\Component\Yaml\Yaml::dump($config, 20));
          '

      - name: Apply database schema
        run: ./openvkctl upgrade --no-interaction --quick

      - name: Check entity setters
        run: php tools/check-entity-setters.php

  migrations:
    name: Unique migration numbers
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      # The checkout contains the PR merged into the base branch, so a number
      # clashing with an already merged migration is caught here as well
      - name: Check install/sqls for duplicate numbers
        run: |
          fail=0
          while IFS= read -r dir; do
            dups=$(find "$dir" -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d- -f1 | sort | uniq -d)
            if [ -n "$dups" ]; then
              fail=1
              echo "::error::$dir contains duplicate migration numbers:"
              for n in $dups; do
                find "$dir" -maxdepth 1 -name "$n-*.sql" -printf '  %f\n'
              done
            fi
          done < <(find install/sqls -type d)
          exit "$fail"
