# Optional nginx snippet for geo-block aware caching.
#
# Include this file inside the `http {}` block, or merge these directives into
# your existing http/server configuration. It requires the nginx geoip2 module
# and a MaxMind-compatible database:
#
#   apt install libnginx-mod-http-geoip2
#   geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
#       $geoip2_country_code country iso_code;
#   }
#
# OpenVK itself uses the PHP reader configured in openvk.yml. The nginx module
# is only needed when the CDN caches responses: the cache key must include the
# country, otherwise a response generated for one country can be served to
# another.
#
# Keep the TTL short because blocking a material does not purge old cache
# entries. OpenVK sends X-Accel-Expires/ Cache-Control with the configured
# `preferences.geo.mediaCacheTtl` for media.

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_country_code country iso_code;
}

proxy_cache_key "$scheme$request_method$host$request_uri$geoip2_country_code";

# Do not cache personalized or country-filtered HTML for long.
proxy_cache_valid 200 60s;

# Media is cached briefly; blocked responses are sent with no-store.
location ~ ^/blob_ {
    proxy_cache_valid 200 5m;
    proxy_pass http://openvk;
}
