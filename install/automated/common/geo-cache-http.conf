# Include this file inside the nginx `http {}` block.
#
# Requires the nginx geoip2 module and a MaxMind-compatible database. Adjust
# the database path and cache directory for your installation.

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_country_code country iso_code;
}

proxy_cache_path /var/cache/nginx/openvk levels=1:2 keys_zone=openvk_geo:10m inactive=10m;

# The country must be part of the key, otherwise a response generated for one
# country can be served to another.
proxy_cache_key "$scheme$request_method$host$request_uri$geoip2_country_code";

upstream openvk_origin {
    server 127.0.0.1:80;
}
