# Include this file inside the nginx `server {}` block that serves OpenVK.
# It relies on geo-cache-http.conf being included in `http {}` first.

proxy_cache openvk_geo;
proxy_cache_valid 200 60s;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

location / {
    proxy_pass http://openvk_origin;
}

# Media is cached briefly. Blocked responses are sent with no-store by
# OpenVK, so they are not stored here.
location ~ ^/blob_ {
    proxy_cache_valid 200 5m;
    proxy_pass http://openvk_origin;
}
